# Render Blueprint: one free Postgres database and one free web service that serves
# both the API and the built React app. Deploy with: Render dashboard → New → Blueprint.
databases:
  - name: ajaia-docs-db
    plan: free
    databaseName: ajaia_docs
    user: ajaia

services:
  - type: web
    name: ajaia-docs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
